name: RED Bit local MCP read pilot

on:
  pull_request:
    branches: [feat/red-bit-audio-continuity-20261128, main]
    paths:
      - 'scripts/redbit-mcp/**'
      - 'docs/red-bit-tool-contract.json'
      - '.github/workflows/red-bit-local-mcp.yml'
  push:
    branches: [feat/red-bit-local-mcp-read-20261128]

permissions:
  contents: read

jobs:
  protocol-fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Lokales MCP-Protokoll und Datenschutz prüfen
        run: python3 -m unittest discover -s scripts/redbit-mcp -v
